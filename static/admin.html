<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin Portal | Burhanuddin Malik</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1731;--bg2:#16224a;--bg3:#1c2b5c;--ink:#f4eedd;--muted:#a9b2cc;--gold:#d0a84f;--gold2:#e5be65;--on:#0e1731;--line:rgba(244,238,221,.15);--line2:rgba(244,238,221,.25);--bad:#ff7b7b;--ok:#8fd19e}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Instrument Serif',Georgia,serif;font-weight:400;line-height:1.15}
h1{font-size:2.2rem;margin-bottom:1rem}h2{font-size:1.5rem;margin:1.4rem 0 .7rem}h3{font-size:1.2rem}
a{color:var(--gold);text-decoration:none}a:hover{text-decoration:underline}
button,.btn{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);padding:.45rem .9rem;text-decoration:none;display:inline-flex;align-items:center;gap:.4rem;transition:border-color .2s,background .2s}
button:hover,.btn:hover{border-color:var(--gold);text-decoration:none}
.pri{background:var(--gold);color:var(--on);border-color:var(--gold);font-weight:600}
.pri:hover{background:var(--gold2);border-color:var(--gold2)}
.sec{background:transparent;border-color:var(--line)}
.danger{color:var(--bad);border-color:rgba(255,123,123,.3)}.danger:hover{border-color:var(--bad);background:rgba(255,123,123,.1)}
.sm{padding:.25rem .55rem;font-size:.82rem;border-radius:6px}
input,select,textarea{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:.55rem .75rem;width:100%;transition:border-color .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(208,168,79,.2)}
textarea{min-height:100px;resize:vertical}
label{display:block;font-size:.88rem;color:var(--muted);margin-bottom:.9rem}
label>input,label>select,label>textarea{margin-top:.3rem;color:var(--ink)}
label.chk{display:flex;gap:.6rem;align-items:center;color:var(--ink);cursor:pointer}label.chk input{width:auto;margin:0}
.help{font-size:.8rem;color:var(--muted);margin-top:.25rem;display:block}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#login{min-height:100vh;display:grid;place-items:center;padding:1.5rem}
#login form{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:2.2rem;width:min(420px,100%);box-shadow:0 20px 50px rgba(0,0,0,.4)}
#app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
#side{background:var(--bg2);border-right:1px solid var(--line);padding:1.2rem 0;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
#side .brand-box{padding:0 1.2rem 1rem;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:.2rem}
#side .brand{font-family:'Instrument Serif',serif;font-size:1.5rem;color:var(--ink);text-decoration:none}
#side .badge{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);font-weight:600}
#side nav{flex:1;padding:.5rem 0}
#side small{display:block;padding:.8rem 1.2rem .3rem;color:var(--muted);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
#side a{display:flex;align-items:center;justify-content:space-between;padding:.42rem 1.2rem;color:var(--ink);text-decoration:none;border-left:3px solid transparent;font-size:.92rem}
#side a:hover{background:var(--bg3);color:#fff}
#side a.on{border-color:var(--gold);background:var(--bg3);color:var(--gold);font-weight:600}
#side a.sub{padding-left:2.1rem;font-size:.88rem;color:var(--muted)}
#side a.sub:hover{color:var(--ink)}#side a.sub.on{color:var(--gold)}
#side .foot{padding:1rem 1.2rem;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:.4rem}
#main-wrap{display:flex;flex-direction:column;min-width:0}
#topbar{background:var(--bg2);border-bottom:1px solid var(--line);padding:.75rem 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;position:sticky;top:0;z-index:20}
.search-box{position:relative;flex:1;max-width:380px}
.search-box input{padding-left:2.2rem;border-radius:999px;font-size:.88rem;height:36px}
.search-box svg{position:absolute;left:.8rem;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted);pointer-events:none}
.top-actions{display:flex;align-items:center;gap:.6rem}
#view{padding:2rem clamp(1rem,3vw,2.8rem);max-width:1160px;width:100%;margin:0 auto}
#mbar{display:none}
@media(max-width:880px){
 #app{grid-template-columns:1fr}
 #side{position:fixed;left:-280px;width:270px;z-index:40;transition:left .25s ease}
 #side.open{left:0}
 #topbar{display:none}
 #mbar{display:flex;justify-content:space-between;align-items:center;padding:.75rem 1rem;background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.9rem;margin:1.2rem 0}
.tile{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:1.1rem;transition:border-color .2s}
.tile:hover{border-color:var(--line2)}
.tile b{display:block;font-family:'Instrument Serif',serif;font-size:2.2rem;font-weight:400;line-height:1.05;color:var(--gold)}
.tile span{color:var(--muted);font-size:.82rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:.6rem .75rem;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em}
tr:hover td{background:rgba(255,255,255,.02)}
.scroll{overflow-x:auto}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:1.4rem;margin-bottom:1.2rem}
.pill{border:1px solid var(--line);border-radius:999px;padding:.1rem .65rem;font-size:.78rem;color:var(--muted);display:inline-block;white-space:nowrap}
.pill.ok{color:var(--ok);border-color:rgba(143,209,158,.3);background:rgba(143,209,158,.1)}
.pill.warn{color:var(--gold);border-color:rgba(208,168,79,.3);background:rgba(208,168,79,.1)}
.pill.bad{color:var(--bad);border-color:rgba(255,123,123,.3);background:rgba(255,123,123,.1)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}@media(max-width:720px){.two{grid-template-columns:1fr}}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}
.bar{height:8px;background:var(--gold);border-radius:4px;min-width:3px}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--on);padding:.75rem 1.4rem;border-radius:10px;z-index:999;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.toast.err{background:var(--bad);color:var(--on)}
[hidden]{display:none!important}
dialog{background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:1.6rem;width:min(640px,calc(100% - 2rem));margin:auto;box-shadow:0 24px 70px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(3,8,24,.75);backdrop-filter:blur(3px)}
.thumb{max-width:140px;max-height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--line);margin-top:.4rem;display:block;background:var(--bg)}
.checks{display:flex;flex-wrap:wrap;gap:.5rem 1.4rem}
.err{color:var(--bad)}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:1rem;margin-top:1rem}
.media-card{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.5rem;cursor:pointer;position:relative;transition:all .2s}
.media-card:hover{border-color:var(--gold);transform:translateY(-2px)}
.media-card.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.media-card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block}
.media-card .doc-icon{width:100%;aspect-ratio:1;display:grid;place-items:center;font-size:2rem;background:var(--bg2);border-radius:6px;color:var(--muted)}
.media-card .m-name{font-size:.78rem;margin-top:.4rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.media-card .m-size{font-size:.72rem;color:var(--muted)}
.drop-zone{border:2px dashed var(--line);border-radius:12px;padding:1.8rem;text-align:center;color:var(--muted);cursor:pointer;transition:border-color .2s,background .2s}
.drop-zone.dragover{border-color:var(--gold);background:rgba(208,168,79,.05)}
.rt-bar{display:flex;flex-wrap:wrap;gap:.3rem;background:var(--bg3);border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;padding:.35rem .5rem}
.rt-bar button{background:none;border:0;padding:.2rem .45rem;border-radius:4px;font-size:.85rem;color:var(--ink);cursor:pointer}
.rt-bar button:hover{background:var(--line);color:var(--gold)}
.rt-box textarea{border-radius:0 0 8px 8px;margin-top:0}
.ord-btn{background:none;border:1px solid var(--line);color:var(--muted);width:26px;height:26px;padding:0;display:inline-grid;place-items:center;border-radius:4px;font-size:.75rem}
.ord-btn:hover{color:var(--gold);border-color:var(--gold)}
.sw{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);display:inline-block}
.theme-card{border:1px solid var(--line);border-radius:12px;padding:1rem;background:var(--bg);display:flex;align-items:center;justify-content:space-between}
</style>
</head>
<body>
<div id="login" hidden>
 <form id="lf">
  <div style="text-align:center;margin-bottom:1.4rem">
   <h1 style="margin-bottom:.2rem">Admin Portal</h1>
   <p style="color:var(--muted);font-size:.9rem">Sign in to manage Burhanuddin Malik Portfolio</p>
  </div>
  <label>Username<input name="username" autocomplete="username" required autofocus placeholder="owner"></label>
  <label>Password<input name="password" type="password" autocomplete="current-password" required placeholder="••••••••"></label>

 </form>
</div>

<div id="mbar" hidden>
 <div class="row" style="gap:.6rem">
  <button id="mtoggle" aria-label="Menu" class="sm">☰</button>

 </div>
 <div class="row" style="gap:.4rem">
  <a class="btn sm" href="/?preview=1" target="_blank">Preview</a>
 </div>
</div>

<div id="app" hidden>
 <aside id="side">
  <div class="brand-box">
   <a href="#/overview" class="brand">Burhanuddin Malik</a>
   <span class="badge">Content Management System</span>
  </div>
  <nav id="sidenav"></nav>
  <div class="foot">
   <a class="btn sm" href="/?preview=1" target="_blank" style="justify-content:center">👁️ Preview Website</a>

  </div>
 </aside>
 <div id="main-wrap">
  <header id="topbar">
   <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input id="globalsearch" placeholder="Global search (projects, blog, media...)" autocomplete="off">
   </div>
   <div class="top-actions">
    <div style="position:relative">
     <button class="btn sm" id="prevmenu-btn">👁️ Preview ▾</button>
     <div id="prevmenu" style="display:none;position:absolute;right:0;top:38px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:.4rem;min-width:170px;box-shadow:0 12px 30px rgba(0,0,0,.5);z-index:90">
      <a class="btn sm" style="width:100%;border:0;justify-content:flex-start" href="/?preview=1" target="_blank">Home Page</a>
      <a class="btn sm" style="width:100%;border:0;justify-content:flex-start" href="/about?preview=1" target="_blank">About Page</a>
      <a class="btn sm" style="width:100%;border:0;justify-content:flex-start" href="/work?preview=1" target="_blank">Work / Projects</a>

      <a class="btn sm" style="width:100%;border:0;justify-content:flex-start" href="/journey?preview=1" target="_blank">Journey Timeline</a>

      <a class="btn sm" style="width:100%;border:0;justify-content:flex-start" href="/contact?preview=1" target="_blank">Contact Page</a>
     </div>
    </div>
    <a class="btn pri sm" href="#/edit/project/new">+ Project</a>
    <a class="btn sm" href="#/media">+ Upload</a>
   </div>
  </header>
  <main id="view" tabindex="-1"></main>
 </div>
</div>

<dialog id="dlg"><div id="dbody"></div></dialog>
<dialog id="media-dlg" style="width:min(900px,calc(100% - 2rem))"><div id="media-dbody"></div></dialog>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let CSRF="",ME=null;
async function api(path,method="GET",body){
 const o={method,headers:{}};
 if(method!=="GET")o.headers["X-CSRF"]=CSRF;
 if(body instanceof FormData)o.body=body;
 else if(body!==undefined){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(body)}
 const r=await fetch(path,o);
 if(r.status===401){showLogin();throw new Error("Please sign in.")}
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(j.error||"Something went wrong ("+r.status+").");
 return j;
}
function toast(m,err){const d=document.createElement("div");d.className="toast"+(err?" err":"");d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),3200)}
const guard=fn=>async(...a)=>{try{return await fn(...a)}catch(e){toast(e.message,true)}};
const fdate=s=>s?String(s).replace("T"," ").replace("Z","").slice(0,16):"";
const fsize=b=>b>1e6?(b/1e6).toFixed(1)+" MB":Math.max(1,Math.round(b/1e3))+" KB";
const secs=s=>s==null?"—":s<60?Math.round(s)+"s":Math.floor(s/60)+"m "+Math.round(s%60)+"s";
const num=n=>n==null?"—":(Math.round(n*10)/10).toString();

/* ---------- content definitions ---------- */
const CATS=["Paintings","Khat","Sketches","Maaraz","Other"],
      ACATS=["Artistic","Sports","Leadership","Certifications","Presentations","Recognition"],
      BCATS=["Khat","Knowledge","Psychology","AI","Technology","Business","Reflections"];

const K={
 project:{group:"Website Content",label:"Projects",one:"Project",fields:[
  ["title","Project Title","text"],
  ["slug","Slug / URL Name","text",0,"Unique web address, like zareeh-mubarak."],
  ["cat","Category","select",CATS],
  ["year","Year / Hijri Date","text"],
  ["featured","Show on Homepage (Featured Work)","bool"],
  ["short","Short Description","textarea"],
  ["cover","Cover Image","media"],
  ["images","Gallery Images","medialist","Add multiple image URLs or select from Media Library."],
  ["facts","Key Facts","kv",0,"One per line, e.g. Medium: Acrylic, Duration: 5 months"],
  ["sections","Story Sections","blocks",0,"Start each section with ## Heading, then write text below."],
  ["timeline","Timeline Process Steps","lines",0,"One step per line."],
  ["techniques","Techniques & Skills","lines",0,"One per line."],
  ["challenges","Challenges Faced","lines",0,"One per line."],
  ["result","Final Result","textarea"],
  ["learned","What I Learned","textarea"],
  ["arabic","Arabic Calligraphy Title (Optional)","text"],
  ["roleList","“My Role” Popup Details","lines",0,"One item per line."],
  ["interactive","Interactive Component","select",["","eye"],"“eye” enables the interactive Eye of Faith explorer."],
  ["pos","Order Index","number"]
 ]},
 gallery:{group:"Website Content",label:"Visual Gallery",one:"Artwork",fields:[
  ["title","Artwork Title","text"],
  ["slug","Slug / Identifier","text"],
  ["category","Category","select",CATS],
  ["year","Year","text"],
  ["description","Description","textarea"],
  ["image","Artwork Image","media"],
  ["project","Linked Project Slug (Optional)","text",0,"Link directly to a project case study."],
  ["pos","Order Index","number"]
 ]},
 journey:{group:"Website Content",label:"Journey",one:"Milestone",fields:[
  ["title","Chapter / Milestone Title","text"],
  ["slug","Slug / Anchor","text",0,"Used for links like /journey#aljamea-surat"],
  ["period","Period / Date","text",0,"e.g. Early years, About four years, Now"],
  ["short","Short Summary","textarea"],
  ["story","Full Narrative Story","textarea",0,"",8],
  ["points","Highlights / Takeaways","lines",0,"One per line."],
  ["areas","Identity Pillars (Optional)","kv",0,"e.g. Creative: Art and Khat"],
  ["closing","Closing Note (Optional)","text"],
  ["image","Milestone Photo","media"],
  ["pos","Order Index","number"]
 ]},
 achievement:{group:"Website Content",label:"Achievements",one:"Achievement",fields:[
  ["title","Achievement Title","text"],
  ["cat","Category","select",ACATS],
  ["details","What I Did","textarea"],
  ["learned","What I Learned","textarea"],
  ["recognition","Recognition Received","textarea"],
  ["project","Linked Project Slug (Optional)","text"],
  ["image","Certificate / Event Photo","media"],
  ["pos","Order Index","number"]
 ]},
 post:{group:"Website Content",label:"Blog Articles",one:"Article",fields:[
  ["title","Article Title","text"],
  ["slug","URL Slug","text"],
  ["category","Category","select",BCATS],
  ["date","Publish Date","date"],
  ["excerpt","Short Summary / Excerpt","textarea"],
  ["cover","Cover Image","media"],
  ["body","Article Body (Rich Text Supported)","richtext",0,"Use the formatting bar above to format text or insert images from Media Library.",16],
  ["tags","Tags","lines",0,"One tag per line."],
  ["seo_title","SEO Title (Optional)","text"],
  ["seo_desc","SEO Description (Optional)","textarea"],
  ["related","Related Project or Journey Slugs","textarea",0,"Slugs separated by comma or new lines."],
  ["soon","Show as “Coming Soon” Placeholder","bool"]
 ]},
 detail:{group:"Private Archive",label:"Full Details",one:"Detail Entry",fields:[
  ["title","Title","text"],
  ["project","Associated Public Slug (Optional)","text"],
  ["date","Date","date"],
  ["details","Private Narrative","textarea",0,"",12],
  ["images","Private Images","pmedialist"]
 ]},
 special:{group:"Private Archive",label:"Special Achievements",one:"Entry",fields:[
  ["title","Title","text"],["date","Date","date"],["details","Details","textarea"],["image","Private Photo","pmedia"]
 ]},
 artwork:{group:"Private Archive",label:"Private Artwork",one:"Artwork",fields:[
  ["title","Title","text"],["year","Year","text"],["details","Story","textarea"],["image","Image","pmedia"]
 ]},
 appreciation:{group:"Private Archive",label:"Appreciation",one:"Entry",fields:[
  ["title","Title","text"],["from","From / Given By","text"],["date","Date","date"],["text","Words of Appreciation","textarea"]
 ]},
 reflection:{group:"Private Archive",label:"Reflections",one:"Reflection",fields:[
  ["title","Title","text"],["date","Date","date"],["text","Reflection","textarea"]
 ]},
 journal:{group:"Private Archive",label:"Personal Journal",one:"Journal Entry",fields:[
  ["title","Title","text"],["date","Date","date"],["text","Journal Entry","textarea",0,"",14]
 ]},
 file:{group:"Private Archive",label:"Documents & Files",one:"File",fields:[
  ["title","Document Title","text"],["details","Description","textarea"],["file","File Attachment","pfile"]
 ]}
};

const PRIV=["detail","special","artwork","appreciation","reflection","journal","file"];
const ACCESS=[["C","All viewers (Levels A, B, C)"],["B","Levels A and B"],["A","Level A only"],["O","Owner only"]];
const TOP=["title","slug","pos"];

/* ---------- form formatting helpers ---------- */
const toLines=a=>(Array.isArray(a)?a:[]).join("\n");
const fromLines=s=>String(s||"").split("\n").map(x=>x.trim()).filter(Boolean);
const toKV=a=>(Array.isArray(a)?a:[]).map(x=>x[0]+": "+x[1]).join("\n");
const fromKV=s=>fromLines(s).map(l=>{const i=l.indexOf(":");return i<0?[l,""]:[l.slice(0,i).trim(),l.slice(i+1).trim()]});
const toBlocks=a=>(Array.isArray(a)?a:[]).map(x=>"## "+x[0]+"\n"+x[1]).join("\n\n");
const fromBlocks=s=>{const out=[];let cur=null;String(s||"").split("\n").forEach(l=>{if(/^## /.test(l)){cur=[l.slice(3).trim(),""];out.push(cur)}else if(cur)cur[1]+=l+"\n"});return out.map(x=>[x[0],x[1].trim()])};

function rtInsert(id,prefix,suffix=""){
 const el=$("#"+id);if(!el)return;
 const start=el.selectionStart,end=el.selectionEnd,val=el.value;
 const sel=val.slice(start,end);
 el.value=val.slice(0,start)+prefix+sel+suffix+val.slice(end);
 el.focus();
 el.setSelectionRange(start+prefix.length,start+prefix.length+sel.length);
}

function fieldHTML(f,v){
 const [n,l,t,o,h,rows]=f,id="f_"+n,help=h?`<span class="help">${esc(h)}</span>`:"";
 if(t==="bool")return `<label class="chk"><input type="checkbox" id="${id}" ${v?"checked":""}> <strong>${esc(l)}</strong></label>`;
 if(t==="select")return `<label>${esc(l)}<select id="${id}">${o.map(x=>`<option value="${esc(x)}" ${x===v?"selected":""}>${esc(x||"(none)")}</option>`).join("")}</select>${help}</label>`;
 if(t==="richtext"){
  return `<label>${esc(l)}<div class="rt-box">
   <div class="rt-bar">
    <button type="button" onclick="rtInsert('${id}','**','**')"><b>B</b></button>

   </div>
   <textarea id="${id}" rows="${rows||12}">${esc(v||"")}</textarea>
  </div>${help}</label>`;
 }
 if(t==="textarea")return `<label>${esc(l)}<textarea id="${id}" ${rows?`rows="${rows}"`:""}>${esc(v||"")}</textarea>${help}</label>`;
 if(["lines","kv","blocks"].includes(t)){

  return `<label>${esc(l)}<textarea id="${id}" ${t==="blocks"?'rows="12"':""}>${esc(s)}</textarea>${help}</label>`;
 }
 if(["media","pmedia","pfile"].includes(t)){
  const priv=t!=="media";

   </div>
   ${t!=="pfile"&&v?`<img class="thumb" src="${esc(v)}" alt="Preview">`:""}
   ${help}
  </label>`;
 }
 if(["medialist","pmedialist"].includes(t)){
  const priv=t==="pmedialist";
  return `<label>${esc(l)}
   <div class="row" style="margin-top:.3rem;margin-bottom:.4rem">
    <button type="button" class="sm" onclick="openMediaPickerMulti(urls=>{const el=$('#${id}');let c=fromLines(el.value);urls.forEach(u=>c.push(u));el.value=c.join('\\n')},${priv?1:0})">+ Add from Media Library</button>
    <label class="btn sm" style="margin:0;cursor:pointer">+ Upload New Files<input type="file" accept="image/*" multiple data-upmulti="${id}" data-priv="${priv?1:0}" style="display:none"></label>
   </div>
   <textarea id="${id}" rows="4" placeholder="One image URL per line">${esc(toLines(v))}</textarea>
   ${help}
  </label>`;
 }
 return `<label>${esc(l)}<input id="${id}" type="${t==="number"?"number":t==="date"?"date":"text"}" value="${esc(v??"")}">${help}</label>`;
}

function promptLink(id){
 const url=prompt("Enter URL (starting with http://, https://, or /):");
 if(url)rtInsert(id,"[","]("+url+")");
}

function collect(fields){
 const data={},top={};
 fields.forEach(f=>{
  const [n,,t]=f,el=$("#f_"+n);if(!el)return;let v;
  if(t==="bool")v=el.checked;
  else if(t==="lines"||t==="medialist"||t==="pmedialist")v=fromLines(el.value);
  else if(t==="kv")v=fromKV(el.value);
  else if(t==="blocks")v=fromBlocks(el.value);
  else if(t==="number")v=el.value===""?0:+el.value;
  else v=el.value.trim();
  (TOP.includes(n)?top:data)[n]=v;
 });
 return {top,data};
}

  const r=a.dataset.r;

  a.classList.toggle("on",on);
 });
 const v=$("#view");v.innerHTML="<p style='color:var(--muted);padding:2rem 0'>Loading…</p>";
 try{
  if(seg[0]==="list")await listView(seg[1]);
  else if(seg[0]==="edit")await editView(seg[1],seg[2]);
  else if(seg[0]==="search")await VIEWS.search(new URLSearchParams(location.hash.split("?")[1]||"").get("q")||"");

 }catch(e){v.innerHTML=`<p class="err" style="padding:2rem 0">${esc(e.message)}</p>`}

}

async function moveItem(kind,id,dir){

}

  toast(status==="published"?"Published successfully!":"Draft saved!");
  location.hash="#/list/"+kind;
 };

/* ---------- analytics view ---------- */
let AR={range:"30d",from:"",to:""};
function chart(d){
 const W=640,H=190,P=28,m=Math.max(1,...d.map(x=>x.views)),n=Math.max(1,d.length-1);
 const pt=(k)=>d.map((x,i)=>`${P+i*(W-P*1.5)/n},${H-P-(x[k]/m)*(H-P*1.5)}`).join(" ");
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%" role="img" aria-label="Views over time"><line x1="${P}" y1="${H-P}" x2="${W-8}" y2="${H-P}" stroke="var(--line)"/><text x="4" y="${P-6}" fill="var(--muted)" font-size="11">${m}</text>
 <polyline fill="none" stroke="var(--gold)" stroke-width="2" points="${pt("views")}"/><polyline fill="none" stroke="#7fb5ff" stroke-width="2" stroke-dasharray="4 3" points="${pt("visitors")}"/>
 <text x="${P}" y="${H-8}" fill="var(--muted)" font-size="11">${esc(d[0]?.day||"")}</text><text x="${W-90}" y="${H-8}" fill="var(--muted)" font-size="11">${esc(d[d.length-1]?.day||"")}</text></svg>`;
}
const barList=(rows,key,val)=>{
 const m=Math.max(1,...rows.map(r=>r[val]));
 return rows.length?`<table><tbody>${rows.map(r=>`<tr><td style="width:45%">${esc(r[key])}</td><td><div class="bar" style="width:${Math.max(3,r[val]/m*100)}%"></div></td><td style="width:50px;text-align:right">${r[val]}</td></tr>`).join("")}</tbody></table>`:`<p style="color:var(--muted)">No data yet.</p>`;
};

 </div>
