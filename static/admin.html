<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Dashboard | Burhanuddin Malik</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1731;--bg2:#16224a;--bg3:#1c2b5c;--ink:#f4eedd;--muted:#a9b2cc;--gold:#d0a84f;--on:#0e1731;--line:rgba(244,238,221,.15);--bad:#e88;--ok:#8fd19e}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15.5px/1.55 'Hanken Grotesk',system-ui,sans-serif}
h1,h2,h3{font-family:'Instrument Serif',Georgia,serif;font-weight:400;line-height:1.15}
h1{font-size:2.2rem;margin-bottom:1.2rem}h2{font-size:1.5rem;margin:1.6rem 0 .8rem}h3{font-size:1.2rem}
a{color:var(--gold)}
button,.btn{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);padding:.5rem 1rem;text-decoration:none;display:inline-block}
button:hover,.btn:hover{border-color:var(--gold)}
.pri{background:var(--gold);color:var(--on);border-color:var(--gold);font-weight:600}
.danger{color:var(--bad)}
input,select,textarea{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:.55rem .75rem;width:100%}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:.88rem;color:var(--muted);margin-bottom:.9rem}
label>input,label>select,label>textarea{margin-top:.3rem;color:var(--ink)}
label.chk{display:flex;gap:.6rem;align-items:center;color:var(--ink)}label.chk input{width:auto;margin:0}
.help{font-size:.8rem;color:var(--muted);margin-top:.2rem;display:block}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#login{min-height:100vh;display:grid;place-items:center;padding:1.5rem}
#login form{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:2rem;width:min(400px,100%)}
#app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
#side{background:var(--bg2);border-right:1px solid var(--line);padding:1.2rem 0;position:sticky;top:0;height:100vh;overflow:auto}
#side .brand{font-family:'Instrument Serif',serif;font-size:1.4rem;padding:0 1.2rem 1rem}
#side small{display:block;padding:.9rem 1.2rem .3rem;color:var(--muted);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase}
#side a{display:block;padding:.45rem 1.2rem;color:var(--ink);text-decoration:none;border-left:2px solid transparent}
#side a:hover{background:var(--bg3)}#side a.on{border-color:var(--gold);background:var(--bg3)}
#side a.sub{padding-left:2.1rem;font-size:.95rem;color:var(--muted)}#side a.sub.on{color:var(--ink)}
#view{padding:2rem clamp(1rem,3vw,2.6rem);max-width:1100px;width:100%}
#mbar{display:none}
@media(max-width:820px){#app{grid-template-columns:1fr}#side{position:fixed;left:-270px;width:260px;z-index:30;transition:left .2s}#side.open{left:0}
 #mbar{display:flex;justify-content:space-between;align-items:center;padding:.7rem 1rem;background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.9rem;margin:1rem 0}
.tile{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:1rem}
.tile b{display:block;font-family:'Instrument Serif',serif;font-size:2.1rem;font-weight:400;line-height:1.1}
.tile span{color:var(--muted);font-size:.85rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th,td{text-align:left;padding:.55rem .6rem;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:.82rem}
.scroll{overflow-x:auto}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:1.2rem;margin-bottom:1rem}
.pill{border:1px solid var(--line);border-radius:999px;padding:.05rem .65rem;font-size:.8rem;color:var(--muted)}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.warn{color:var(--gold);border-color:var(--gold)}.pill.bad{color:var(--bad);border-color:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1rem}@media(max-width:700px){.two{grid-template-columns:1fr}}
.bar{height:8px;background:var(--gold);border-radius:4px;min-width:2px}
.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--on);padding:.7rem 1.2rem;border-radius:10px;z-index:99;font-weight:600}
.toast.err{background:var(--bad);color:var(--on)}
[hidden]{display:none!important}
dialog{background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:1.4rem;width:min(520px,calc(100% - 2rem))}
dialog::backdrop{background:rgba(3,8,24,.7)}
.thumb{max-width:160px;max-height:110px;border-radius:8px;border:1px solid var(--line);margin-top:.5rem;display:block}
.checks{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem}
.err{color:var(--bad)}
</style>
</head>
<body>
<div id="login" hidden>
 <form id="lf"><h1 style="margin-bottom:.3rem">Dashboard</h1><p style="color:var(--muted);margin-bottom:1.2rem">Owner sign-in</p>
  <label>Username<input name="username" autocomplete="username" required></label>
  <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
  <button class="pri" style="width:100%">Sign in</button><p id="lerr" class="err" style="margin-top:.8rem" role="alert"></p></form>
</div>
<div id="mbar" hidden><strong style="font-family:'Instrument Serif',serif;font-size:1.2rem">Dashboard</strong><button id="mtoggle">Menu</button></div>
<div id="app" hidden>
 <aside id="side"></aside>
 <main id="view" tabindex="-1"></main>
</div>
<dialog id="dlg"><div id="dbody"></div></dialog>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let CSRF="",ME=null;
async function api(path,method="GET",body){
 const o={method,headers:{}};
 if(method!=="GET")o.headers["X-CSRF"]=CSRF;
 if(body instanceof FormData)o.body=body;else if(body!==undefined){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(body)}
 const r=await fetch(path,o);
 if(r.status===401){showLogin();throw new Error("Please sign in.")}
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(j.error||"Something went wrong ("+r.status+").");
 return j}
function toast(m,err){const d=document.createElement("div");d.className="toast"+(err?" err":"");d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),3200)}
const guard=fn=>async(...a)=>{try{return await fn(...a)}catch(e){toast(e.message,true)}};
const fdate=s=>s?String(s).replace("T"," ").replace("Z","").slice(0,16):"";
const secs=s=>s==null?"—":s<60?Math.round(s)+"s":Math.floor(s/60)+"m "+Math.round(s%60)+"s";
const num=n=>n==null?"—":(Math.round(n*10)/10).toString();

/* ---------- content types ---------- */
const CATS=["Paintings","Khat","Sketches","Maaraz","Other"],ACATS=["Artistic","Sports","Leadership","Certifications","Presentations","Recognition"],BCATS=["Khat","Knowledge","Psychology","AI","Technology","Business","Reflections"];
const K={
 project:{group:"Portfolio",label:"Projects",one:"Project",fields:[["title","Title","text"],["slug","Web address name","text",0,"Leave empty to create it from the title."],["cat","Category","select",CATS],["year","Year","text"],["featured","Show on the homepage (up to 4)","bool"],["short","Short description","textarea"],["cover","Cover image","image"],["images","More images","images"],["facts","Quick facts","kv",0,"One per line, like:  Medium: Acrylic"],["sections","Story sections","blocks",0,"Start each section with ## Heading, then its text. Leave a blank line between paragraphs."],["timeline","Timeline steps","lines",0,"One per line."],["techniques","Techniques","lines",0,"One per line."],["challenges","Challenges","lines",0,"One per line."],["result","Result","textarea"],["learned","What I learned","textarea"],["arabic","Arabic title (optional)","text"],["roleList","“My role” popup","lines",0,"One per line. Leave empty for no popup."],["interactive","Interactive extra","select",["","eye"],"“eye” adds the clickable eye used for Faith & Worldly Realm."],["pos","Order (lowest first)","number"]]},
 gallery:{group:"Portfolio",label:"Gallery",one:"Artwork",fields:[["title","Title","text"],["slug","Web address name","text"],["category","Category","select",CATS],["year","Year","text"],["description","Short description","textarea"],["image","Image","image"],["project","Linked project (its web address name)","text"],["pos","Order","number"]]},
 journey:{group:"Portfolio",label:"Journey",one:"Chapter",fields:[["title","Title","text"],["slug","Web address name","text",0,"Used in links like /journey#aljamea-surat"],["period","When","text"],["short","Short description","textarea"],["story","Full story","textarea"],["points","Highlights","lines",0,"One per line."],["areas","Identity areas (optional)","kv",0,"One per line, like:  Creative: Art and Khat"],["closing","Closing line (optional)","text"],["image","Image","image"],["pos","Order","number"]]},
 achievement:{group:"Portfolio",label:"Achievements",one:"Achievement",fields:[["title","Title","text"],["cat","Category","select",ACATS],["details","What I did","textarea"],["learned","What I learned","textarea"],["recognition","Recognition","textarea"],["project","Linked project (its web address name)","text"],["image","Photo","image"],["pos","Order","number"]]},
 post:{group:"Blog",label:"Articles",one:"Article",fields:[["title","Title","text"],["slug","Web address name","text"],["category","Category","select",BCATS],["date","Publish date","date"],["excerpt","Short summary","textarea"],["cover","Cover image","image"],["body","Article","textarea",0,"Write in paragraphs. Start a line with ## for a heading. Use **bold** for emphasis.",18],["related","Related projects / journey chapters","textarea",0,"Web address names, one per line."],["soon","Show as “Coming soon” placeholder","bool"]]},
 detail:{group:"Private Archive",label:"Full Details",one:"Detail",fields:[["title","Title","text"],["project","About which public item (its web address name, optional)","text",0,"For example zareeh-mubarak or aljamea-surat. Viewers get a link to the public page."],["date","Date","date"],["details","The full story or details you don't share publicly","textarea",0,"",14],["images","Private photos","pimages"]]},
 special:{group:"Private Archive",label:"Special Achievements",one:"Entry",fields:[["title","Title","text"],["date","Date","date"],["details","Details","textarea",0,"",10],["image","Photo","pimage"]]},
 artwork:{group:"Private Archive",label:"Private Artwork",one:"Artwork",fields:[["title","Title","text"],["year","Year","text"],["details","About this artwork","textarea"],["image","Image","pimage"]]},
 appreciation:{group:"Private Archive",label:"Appreciation",one:"Entry",fields:[["title","Title","text"],["from","From","text"],["date","Date","date"],["text","Words of appreciation","textarea",0,"",10]]},
 reflection:{group:"Private Archive",label:"Reflections",one:"Reflection",fields:[["title","Title","text"],["date","Date","date"],["text","Reflection","textarea",0,"",12]]},
 journal:{group:"Private Archive",label:"Journal",one:"Journal entry",fields:[["title","Title","text"],["date","Date","date"],["text","Entry","textarea",0,"",14]]},
 file:{group:"Private Archive",label:"Files",one:"File",fields:[["title","Title","text"],["details","Description","textarea"],["file","File or photo","pfile"]]}
};
const PRIV=["detail","special","artwork","appreciation","reflection","journal","file"];
const ACCESS=[["C","All viewers (Levels A, B, C)"],["B","Levels A and B"],["A","Level A only"],["O","Owner only"]];
const TOP=["title","slug","pos"];

/* ---------- form helpers ---------- */
const toLines=a=>(Array.isArray(a)?a:[]).join("\n");
const fromLines=s=>s.split("\n").map(x=>x.trim()).filter(Boolean);
const toKV=a=>(Array.isArray(a)?a:[]).map(x=>x[0]+": "+x[1]).join("\n");
const fromKV=s=>fromLines(s).map(l=>{const i=l.indexOf(":");return i<0?[l,""]:[l.slice(0,i).trim(),l.slice(i+1).trim()]});
const toBlocks=a=>(Array.isArray(a)?a:[]).map(x=>"## "+x[0]+"\n"+x[1]).join("\n\n");
const fromBlocks=s=>{const out=[];let cur=null;s.split("\n").forEach(l=>{if(/^## /.test(l)){cur=[l.slice(3).trim(),""];out.push(cur)}else if(cur)cur[1]+=l+"\n"});return out.map(x=>[x[0],x[1].trim()])};
function fieldHTML(f,v){
 const [n,l,t,o,h,rows]=f,id="f_"+n,help=h?`<span class="help">${esc(h)}</span>`:"";
 if(t==="bool")return `<label class="chk"><input type="checkbox" id="${id}" ${v?"checked":""}> ${esc(l)}</label>`;
 if(t==="select")return `<label>${esc(l)}<select id="${id}">${o.map(x=>`<option value="${esc(x)}" ${x===v?"selected":""}>${esc(x||"(none)")}</option>`).join("")}</select>${help}</label>`;
 if(t==="textarea")return `<label>${esc(l)}<textarea id="${id}" ${rows?`rows="${rows}"`:""}>${esc(v||"")}</textarea>${help}</label>`;
 if(["lines","kv","blocks","images","pimages"].includes(t)){const s=t==="lines"||t==="images"||t==="pimages"?toLines(v):t==="kv"?toKV(v):toBlocks(v);
  return `<label>${esc(l)}<textarea id="${id}" ${t==="blocks"?'rows="14"':""}>${esc(s)}</textarea>${help}${t==="images"||t==="pimages"?`<span class="help">Paste image addresses, or <input type="file" accept="image/*" multiple data-priv="${t==="pimages"?1:0}" data-upmulti="${id}" style="width:auto;display:inline"> to upload.</span>`:""}</label>`}
 if(["image","pimage","pfile"].includes(t)){const priv=t!=="image";
  return `<label>${esc(l)}<input id="${id}" value="${esc(v||"")}" placeholder="No file yet">${help}<span class="help"><input type="file" ${t==="pfile"?"":'accept="image/*"'} data-up="${id}" data-priv="${priv?1:0}" style="width:auto;display:inline"></span>${t!=="pfile"&&v?`<img class="thumb" src="${esc(v)}" alt="">`:""}</label>`}
 return `<label>${esc(l)}<input id="${id}" type="${t==="number"?"number":t==="date"?"date":"text"}" value="${esc(v??"")}">${help}</label>`}
function collect(fields){
 const data={},top={};
 fields.forEach(f=>{const [n,,t]=f,el=$("#f_"+n);if(!el)return;let v;
  if(t==="bool")v=el.checked;else if(t==="lines"||t==="images"||t==="pimages")v=fromLines(el.value);else if(t==="kv")v=fromKV(el.value);else if(t==="blocks")v=fromBlocks(el.value);else if(t==="number")v=el.value===""?0:+el.value;else v=el.value.trim();
  (TOP.includes(n)?top:data)[n]=v});
 return {top,data}}
document.addEventListener("change",guard(async e=>{
 const t=e.target;
 if(t.dataset.up){const f=t.files[0];if(!f)return;const fd=new FormData();fd.append("file",f);fd.append("private",t.dataset.priv);toast("Uploading…");const r=await api("/api/admin/upload","POST",fd);$("#"+t.dataset.up).value=r.url;toast("Uploaded");}
 if(t.dataset.upmulti){const ta=$("#"+t.dataset.upmulti);let cur=fromLines(ta.value);toast("Uploading…");for(const f of t.files){const fd=new FormData();fd.append("file",f);fd.append("private",t.dataset.priv||"0");cur.push((await api("/api/admin/upload","POST",fd)).url)}ta.value=cur.join("\n");toast("Uploaded")}
}));

/* ---------- navigation ---------- */
const NAVS=[["Overview","overview"],["Portfolio"],["Projects","list/project","sub"],["Gallery","list/gallery","sub"],["Journey","list/journey","sub"],["Achievements","list/achievement","sub"],["Blog","list/post"],
 ["Private Archive"],["Full Details","list/detail","sub"],["Journal","list/journal","sub"],["Artwork","list/artwork","sub"],["Appreciation","list/appreciation","sub"],["Reflections","list/reflection","sub"],["Special Achievements","list/special","sub"],["Files","list/file","sub"],
 ["Viewers & Permissions","viewers"],["Analytics","analytics"],["Feedback","feedback"],["Messages","messages"],["Activity","activity"],["Backups","backups"],["Settings","settings"]];
function drawSide(){
 $("#side").innerHTML=`<div class="brand">Dashboard</div>`+NAVS.map(n=>n[1]?`<a href="#/${n[1]}" class="${n[2]||""}" data-r="${n[1]}">${n[0]}</a>`:`<small>${n[0]}</small>`).join("")+
 `<small>Site</small><a href="/" target="_blank">View public site</a><a href="#" id="out">Sign out</a>`}
$("#mtoggle").onclick=()=>$("#side").classList.toggle("open");
document.addEventListener("click",guard(async e=>{
 if(e.target.id==="out"){e.preventDefault();await api("/api/logout","POST");showLogin()}
 if(e.target.closest("#side a[data-r]"))$("#side").classList.remove("open");
 const b=e.target.closest("[data-act]");if(b)await ACT[b.dataset.act](b);
}));

/* ---------- login ---------- */
function showLogin(){$("#app").hidden=true;$("#mbar").hidden=true;$("#login").hidden=false}
$("#lf").onsubmit=async e=>{e.preventDefault();$("#lerr").textContent="";
 try{const r=await api("/api/login","POST",Object.fromEntries(new FormData(e.target)));if(r.role!=="owner"){location.href="/private";return}CSRF=r.csrf;ME=r;start()}
 catch(err){$("#lerr").textContent=err.message}};
async function boot(){try{const r=await api("/api/me");if(r.role==="owner"){CSRF=r.csrf;ME=r;start()}else if(r.role){location.href="/private"}else showLogin()}catch(e){showLogin()}}
function start(){$("#login").hidden=true;$("#app").hidden=false;$("#mbar").hidden=matchMedia("(min-width:821px)").matches;drawSide();route()}

/* ---------- router ---------- */
async function route(){
 const seg=(location.hash.replace(/^#\/?/,"")||"overview").split("/");
 $$("#side a[data-r]").forEach(a=>a.classList.toggle("on",a.dataset.r===seg.slice(0,2).join("/")||a.dataset.r===seg[0]&&seg[0]!=="list"&&seg[0]!=="edit"||(seg[0]==="edit"&&a.dataset.r==="list/"+seg[1])));
 const v=$("#view");v.innerHTML="<p style='color:var(--muted)'>Loading…</p>";
 try{
  if(seg[0]==="list")await listView(seg[1]);else if(seg[0]==="edit")await editView(seg[1],seg[2]);
  else if(VIEWS[seg[0]])await VIEWS[seg[0]]();else await VIEWS.overview();
 }catch(e){v.innerHTML=`<p class="err">${esc(e.message)}</p>`}
 window.scrollTo(0,0)}
addEventListener("hashchange",()=>{if(ME)route()});

const VIEWS={};
const ACT={};

/* ---------- overview ---------- */
const actList=l=>l.length?`<table><tbody>${l.map(a=>`<tr><td style="white-space:nowrap;color:var(--muted)">${fdate(a.ts)}</td><td>${esc(a.action)}${a.obj?` <span style="color:var(--muted)">· ${esc(a.obj)}</span>`:""}</td></tr>`).join("")}</tbody></table>`:`<p style="color:var(--muted)">Nothing yet.</p>`;
VIEWS.overview=async()=>{const o=await api("/api/admin/overview");
 $("#view").innerHTML=`<h1>Overview</h1>
 <div class="row"><a class="btn pri" href="#/edit/project/new">New project</a><a class="btn" href="#/edit/gallery/new">New artwork</a><a class="btn" href="#/edit/journal/new">New journal entry</a><a class="btn" href="#/edit/post/new">New blog post</a><a class="btn" href="#/edit/achievement/new">New achievement</a><a class="btn" href="#/edit/file/new">Upload file</a></div>
 <div class="tiles">${[["Projects",o.projects],["Artworks",o.artworks],["Achievements",o.achievements],["Journal entries",o.journal],["Files",o.files],["Blog posts",o.posts+" live"+(o.drafts?`, ${o.drafts} draft`:"")],["Unread messages",o.unread],["Viewers",o.viewers]].map(t=>`<div class="tile"><b>${esc(t[1])}</b><span>${t[0]}</span></div>`).join("")}</div>
 <div class="two"><div class="card"><h3>Recent activity</h3>${actList(o.recent)}</div><div><div class="card"><h3>Private archive activity</h3>${actList(o.archive)}</div><div class="card"><h3>Viewer &amp; settings changes</h3>${actList(o.access)}</div></div></div>`};

/* ---------- lists + editing ---------- */
async function listView(kind,q=""){
 const k=K[kind];if(!k)throw new Error("Unknown section.");
 const r=await api("/api/admin/items?kind="+kind+(q?"&q="+encodeURIComponent(q):""));
 $("#view").innerHTML=`<div class="row" style="justify-content:space-between"><h1 style="margin:0">${k.label}</h1><a class="btn pri" href="#/edit/${kind}/new">New ${k.one.toLowerCase()}</a></div>
 <div class="row" style="margin:1rem 0"><input id="q" placeholder="Search" value="${esc(q)}" style="max-width:320px"></div>
 <div class="scroll"><table><thead><tr><th>Title</th><th></th><th>Status</th><th>Updated</th></tr></thead><tbody>${r.items.map(i=>`<tr><td><a href="#/edit/${kind}/${i.id}">${esc(i.title)}</a></td><td style="color:var(--muted)">${esc(i.data.cat||i.data.category||i.data.year||i.data.date||"")}</td><td><span class="pill ${i.status==="published"?"ok":"warn"}">${i.status}</span>${PRIV.includes(kind)?` <span class="pill">${{C:"all viewers",B:"A + B",A:"A only",O:"owner only"}[i.access]}</span>`:""}</td><td style="color:var(--muted)">${fdate(i.updated)}</td></tr>`).join("")||`<tr><td colspan="4" style="color:var(--muted)">Nothing here yet.</td></tr>`}</tbody></table></div>`;
 let tm;$("#q").oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>listView(kind,e.target.value).then(()=>{const el=$("#q");el.focus();el.setSelectionRange(99,99)}),350)}}
async function editView(kind,id){
 const k=K[kind];if(!k)throw new Error("Unknown section.");
 let it={title:"",slug:"",pos:0,status:PRIV.includes(kind)?"published":"draft",access:"A",data:{}};
 if(id!=="new")it=await api("/api/admin/items/"+id);
 const val=n=>TOP.includes(n)?it[n]:it.data[n];
 $("#view").innerHTML=`<p><a href="#/list/${kind}">← ${k.label}</a></p><h1>${id==="new"?"New "+k.one.toLowerCase():"Edit "+k.one.toLowerCase()}</h1>
 <div class="card">${k.fields.map(f=>fieldHTML(f,val(f[0]))).join("")}
 <div class="two"><label>Status<select id="f_status"><option value="published" ${it.status==="published"?"selected":""}>Published</option><option value="draft" ${it.status==="draft"?"selected":""}>Draft (hidden)</option></select></label>
 ${PRIV.includes(kind)?`<label>Who can see it<select id="f_access">${ACCESS.map(a=>`<option value="${a[0]}" ${it.access===a[0]?"selected":""}>${a[1]}</option>`).join("")}</select></label>`:""}</div>

/* ---------- analytics ---------- */
let AR={range:"30d",from:"",to:""};
function chart(d){const W=640,H=190,P=28,m=Math.max(1,...d.map(x=>x.views)),n=Math.max(1,d.length-1);
 const pt=(k)=>d.map((x,i)=>`${P+i*(W-P*1.5)/n},${H-P-(x[k]/m)*(H-P*1.5)}`).join(" ");
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%" role="img" aria-label="Views over time"><line x1="${P}" y1="${H-P}" x2="${W-8}" y2="${H-P}" stroke="var(--line)"/><text x="4" y="${P-6}" fill="var(--muted)" font-size="11">${m}</text>
 <polyline fill="none" stroke="var(--gold)" stroke-width="2" points="${pt("views")}"/><polyline fill="none" stroke="#7fb5ff" stroke-width="2" stroke-dasharray="4 3" points="${pt("visitors")}"/>
 <text x="${P}" y="${H-8}" fill="var(--muted)" font-size="11">${esc(d[0]?.day||"")}</text><text x="${W-90}" y="${H-8}" fill="var(--muted)" font-size="11">${esc(d[d.length-1]?.day||"")}</text></svg>`}
const barList=(rows,key,val)=>{const m=Math.max(1,...rows.map(r=>r[val]));return rows.length?`<table><tbody>${rows.map(r=>`<tr><td style="width:45%">${esc(r[key])}</td><td><div class="bar" style="width:${Math.max(3,r[val]/m*100)}%"></div></td><td style="width:50px;text-align:right">${r[val]}</td></tr>`).join("")}</tbody></table>`:`<p style="color:var(--muted)">No data yet.</p>`};
VIEWS.analytics=async()=>{
 const q=new URLSearchParams({range:AR.range,from:AR.from,to:AR.to});const a=await api("/api/admin/analytics?"+q);
 const trend=a.prev_views!=null&&a.prev_views>0?Math.round((a.views-a.prev_views)/a.prev_views*100):null,e=a.engagement;
 $("#view").innerHTML=`<h1>Analytics</h1>
 <div class="row"><select id="ar" style="width:auto">${[["today","Today"],["7d","Last 7 days"],["30d","Last 30 days"],["90d","Last 3 months"],["all","All time"],["custom","Custom range"]].map(o=>`<option value="${o[0]}" ${AR.range===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select>
 ${AR.range==="custom"?`<input type="date" id="af" value="${AR.from}" style="width:auto"><input type="date" id="at" value="${AR.to}" style="width:auto"><button id="ago">Apply</button>`:""}
 <span style="flex:1"></span><a class="btn" href="/api/admin/export/analytics?fmt=csv">CSV</a><a class="btn" href="/api/admin/export/analytics?fmt=xlsx">Excel</a><a class="btn" href="/api/admin/export/traffic?fmt=csv">Traffic CSV</a><a class="btn" href="/api/admin/export/traffic?fmt=xlsx">Traffic Excel</a></div>
 <div class="tiles"><div class="tile"><b>${a.visitors}</b><span>Visitors (daily unique)</span></div><div class="tile"><b>${a.views}</b><span>Page views${trend!=null?` · ${trend>=0?"+":""}${trend}% vs previous period`:""}</span></div><div class="tile"><b>${secs(e.avg_time_site)}</b><span>Avg. time on site</span></div><div class="tile"><b>${secs(e.avg_time_page)}</b><span>Avg. time per page</span></div></div>
 <div class="card"><h3>Views over time</h3><p class="help">Gold: page views. Blue dashed: visitors.</p>${chart(a.daily)}</div>
 <div class="two"><div class="card"><h3>Most-viewed pages</h3>${barList(a.pages,"path","views")}</div><div class="card"><h3>Most-viewed projects</h3>${barList(a.projects,"title","views")}</div>
 <div class="card"><h3>Most-viewed artworks</h3>${barList(a.artworks,"title","views")}<p class="help" style="margin-top:.6rem">Khat views (projects + artworks): ${a.khat_views}</p></div><div class="card"><h3>Most-viewed articles</h3>${barList(a.articles,"title","views")}</div>
 <div class="card"><h3>Traffic sources</h3>${barList(a.sources,"name","visits")}<p class="help" style="margin-top:.6rem">Tip: share links like <code>yoursite.com/?src=instagram</code> so in-app browsers are counted correctly.</p></div><div class="card"><h3>Devices</h3>${barList(a.devices,"name","visits")}</div>
 <div class="card"><h3>Featured work engagement</h3><p>${a.engagement.featured.views} views · avg. ${secs(e.featured.avg_time)} per view</p></div><div class="card"><h3>Blog engagement</h3><p>${e.blog.views} views · avg. ${secs(e.blog.avg_time)} per view</p></div></div>
 <p class="help">Privacy: no cookies, no IP addresses stored, no personal data. Visitors are counted using a hash that changes every day, so the same person on different days counts as separate visitors. Visits from you (while signed in) aren't counted.</p>`;
 $("#ar").onchange=e=>{AR.range=e.target.value;VIEWS.analytics()};
 if($("#ago"))$("#ago").onclick=guard(()=>{AR.from=$("#af").value;AR.to=$("#at").value;return VIEWS.analytics()})};
